name: Bug report
description: Report a reproducible problem with this unofficial fork.
body:
  - type: markdown
    attributes:
      value: Do not include tokens, private data or health records. For vulnerabilities, see SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Fork version, Open WebUI runtime version, OS and architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: Include local/remote server, workspace and connector type if relevant. Use a disposable example.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove tokens, account details, private paths and personal data first.
