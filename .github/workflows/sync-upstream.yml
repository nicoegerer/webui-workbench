name: Sync Official Upstream

on:
  workflow_dispatch:
  push:
    branches: [managed-services]
    paths:
      - '.github/workflows/sync-upstream.yml'
      - '.github/scripts/prepare-upstream-sync.mjs'
      - '.github/scripts/keep-sync-active.mjs'
      - '.github/scripts/check-public-distribution.mjs'
      - 'tests/upstream-sync.test.mjs'
  schedule:
    - cron: '17 6 * * *'
    # Temporary publication smoke test; remove after observing the scheduled run.
    - cron: '42 10 25 9 *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    name: Mirror upstream and publish Workbench fork update
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream and fork branches
        run: |
          git remote add upstream https://github.com/open-webui/desktop.git
          git fetch upstream main
          git fetch origin main managed-services release

      - name: Prepare release candidate from both official projects
        id: candidate
        run: |
          BACKEND_TAG=$(gh release view --repo open-webui/open-webui --json tagName --jq .tagName)
          node .github/scripts/prepare-upstream-sync.mjs "$BACKEND_TAG"

      - name: Verify candidate before publishing any branch
        # Also verify one-time setup changes even if upstream has no new commit.
        if: steps.candidate.outputs.changed == 'true' || github.event_name == 'push'
        run: |
          npm ci
          npm run test:ipc
          npm run build
          python .github/scripts/check-runtime-contract.py

      - name: Keep the schedule active during long upstream pauses
        if: steps.candidate.outputs.changed == 'false'
        run: node .github/scripts/keep-sync-active.mjs

      - name: Publish branches atomically (never force)
        run: |
          git push --atomic origin upstream/main:main HEAD:managed-services HEAD:release

      - name: Explicitly start release, or recover a missing release
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
        run: |
          # GITHUB_TOKEN pushes do not trigger on:push workflows.
          # Adding an upstream remote changes gh's inferred default repository.
          # Every fork operation must explicitly target this workflow's repository.
          if [ "$CHANGED" = "true" ]; then
            gh workflow run release.yml --ref release --repo "$GITHUB_REPOSITORY"
          elif ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'latest.yml'; then
            ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch release --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" = "0" ]; then
              gh workflow run release.yml --ref release --repo "$GITHUB_REPOSITORY"
            fi
          fi
